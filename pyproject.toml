[project]
name = "six-faces"
version = "0.1.0"
description = "Six-Faces — la presse québécoise, sous toutes ses faces: collecte quotidienne des médias québécois, regroupement des articles par sujet et comparaison de la couverture."
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
extend-exclude = ["migrations/versions"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]
